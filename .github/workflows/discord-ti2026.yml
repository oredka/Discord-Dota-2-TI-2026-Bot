name: The International 2026 Discord updates

on:
  push:
    branches: [ main ]
    paths:
      - 'main.py'
      - 'team_metadata.json'
      - '.github/workflows/discord-ti2026.yml'
  schedule:
    # Every 10 minutes (broad coverage)
    - cron: "*/10 * 13-24 8 *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-update:
    runs-on: ubuntu-latest
    # We removed the 'if: github.actor != ...' condition to ensure scheduled runs always execute.
    # Since we only trigger on schedule and dispatch, there is no risk of a commit loop.
    env:
      SERIES_BEST_OF: ${{ vars.SERIES_BEST_OF || '3' }}
      LIQUIPEDIA_USER_AGENT: ${{ vars.LIQUIPEDIA_USER_AGENT || 'TI2026DiscordBot/1.0 (GitHub Actions)' }}
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Publish a new match update
        run: python main.py

      - name: Save the last published match
        run: |
          if test -z "$(git status --porcelain -- .state/match_states.json)"; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f .state/match_states.json
          git commit -m "chore: remember TI match states"
          # Retry push up to 3 times in case of transient errors
          for i in {1..3}; do
            git pull --rebase origin main && git push && break || sleep 5
          done
