name: The International 2026 Discord updates

on:
  push:
    branches: [ main ]
    paths:
      - 'main.py'
      - 'config.py'
      - 'tournament.py'
      - 'discord_messages.py'
      - 'state.py'
      - 'http_client.py'
      - 'api/**'
      - 'uk_text.py'
      - 'tournament_config.json'
      - 'team_metadata.json'
      - '.github/workflows/discord-ti2026.yml'
  schedule:
    - cron: "*/10 * 13-24 8 *"
  workflow_dispatch:

permissions:
  contents: write

# Two overlapping runs would read the same state and publish the same events twice.
concurrency:
  group: discord-ti2026-updates
  cancel-in-progress: true

jobs:
  publish-update:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      LIQUIPEDIA_USER_AGENT: ${{ vars.LIQUIPEDIA_USER_AGENT || 'TI2026DiscordBot/1.0 (GitHub Actions)' }}
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Publish a new match update
        run: python main.py

      # Without this the next run starts from an empty state and re-publishes the whole day.
      - name: Save the published match states
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- 'states/match_states*.json'
          if git diff --cached --quiet; then
            echo "No new match states to remember."
            exit 0
          fi
          git commit -m "chore: remember TI match states"
          pushed=0
          for i in 1 2 3; do
            if git pull --rebase --autostash origin main && git push origin HEAD:main; then
              pushed=1
              break
            fi
            git rebase --abort || true
            sleep 5
          done
          if test "$pushed" -ne 1; then
            echo "::error::Could not push match states; the next run would republish these events."
            python -c "import os; from discord_messages import publish_state_push_failure; publish_state_push_failure(os.environ.get('DISCORD_WEBHOOK_URL', ''))" || echo "Warning: could not notify Discord of the failed state push."
            exit 1
          fi
