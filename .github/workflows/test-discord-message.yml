name: Test Discord Message

on:
  workflow_dispatch:
    inputs:
      message_type:
        description: 'Which message type to test'
        required: true
        default: 'day'
        type: choice
        options:
          - day
          - live
          - game_finished
          - series_finished

permissions:
  contents: read

jobs:
  test-message:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Debug variables
        run: |
          echo "DISCORD_WEBHOOK_URL length: ${#DISCORD_WEBHOOK_URL}"
          echo "STRATZ_API_TOKEN length: ${#STRATZ_API_TOKEN}"
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          STRATZ_API_TOKEN: ${{ secrets.STRATZ_API_TOKEN }}

      - name: Send test Discord message
        env:
          WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          pip install requests -q
          python3 << 'EOF'
          import json
          import requests
          import sys
          import os
           
          webhook_url = os.environ.get('WEBHOOK_URL', '')
          msg_type = '${{ github.event.inputs.message_type }}'
           
          if not webhook_url:
              print('❌ Error: DISCORD_WEBHOOK_URL variable not set in repository')
              sys.exit(1)
           
          # Keep text format in sync with main.py message()
          messages = {
              'day': '📅 **ДЕНЬ 1 THE INTERNATIONAL 2026**\nhttps://www.youtube.com/@Dota2_maincast',
              'live': '🔴 **МАТЧ РОЗПОЧАВСЯ**\n🇪🇺 Team Liquid 🆚 🇨🇳 Xtreme Gaming\nГра 1',
              'game_finished': '🎮 **ГРА 1 ЗАВЕРШИЛАСЯ**\n🇪🇺 Team Liquid 1 — 0 🇨🇳 Xtreme Gaming\n⏱ Тривалість: 42:15',
              'series_finished': '🏆 **МАТЧ ЗАВЕРШИВСЯ**\n🇪🇺 Team Liquid 3 — 1 🇨🇳 Xtreme Gaming\n🥇 Переможець: 🇪🇺 Team Liquid'
          }
           
          payload = {
              'username': 'The International 2026',
              'content': messages.get(msg_type, messages['day']),
          }
           
          print(f"Payload JSON: {json.dumps(payload, ensure_ascii=False)[:500]}...")
           
          try:
              response = requests.post(webhook_url, json=payload, timeout=10)
              if response.status_code == 204:
                  print(f'✅ SUCCESS! Message sent (HTTP {response.status_code})')
              else:
                  print(f'✗ HTTP Error {response.status_code}')
                  print(f'Response: {response.text}')
                  sys.exit(1)
          except Exception as e:
              print(f'✗ Error: {e}')
              sys.exit(1)
          EOF
