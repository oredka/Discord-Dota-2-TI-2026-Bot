name: Test Discord Message

on:
  workflow_dispatch:
    inputs:
      message_type:
        description: 'Which message type to test'
        required: true
        default: 'day'
        type: choice
        options:
          - day
          - day_no_matches
          - game_finished
          - series_finished

permissions:
  contents: read

jobs:
  test-message:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Debug variables
        run: |
          echo "DISCORD_WEBHOOK_URL length: ${#DISCORD_WEBHOOK_URL}"
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}

      - name: Send test Discord message
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          MESSAGE_TYPE: ${{ github.event.inputs.message_type }}
        run: |
          pip install requests -q
          python test_discord_message.py
